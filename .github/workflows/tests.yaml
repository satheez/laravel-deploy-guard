name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
            pest: '^2.0'
            pest_plugin_laravel: '^2.0'
            larastan: '^2.0'
            rector: '^1.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^3.0'
            pest_plugin_laravel: '^3.0'
            larastan: '^3.0'
            rector: '^2.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
            pest_plugin_laravel: '^4.0'
            larastan: '^3.0'
            rector: '^2.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict --no-check-lock

      - name: Configure Dependency Matrix
        run: |
          composer require laravel/framework:${{ matrix.laravel }} --no-interaction --no-update
          composer require --dev orchestra/testbench:${{ matrix.testbench }} pestphp/pest:${{ matrix.pest }} pestphp/pest-plugin-laravel:${{ matrix.pest_plugin_laravel }} larastan/larastan:${{ matrix.larastan }} rector/rector:${{ matrix.rector }} --no-interaction --no-update

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pest
        run: composer test

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run Rector Dry Run
        run: composer rector:test

      - name: Run Larastan
        run: composer analyse
