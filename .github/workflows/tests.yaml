name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['^10.0', '^11.0', '^12.0']

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Configure Composer
        run: |
          composer config --global --unset github-oauth.github.com || true
          composer config --global use-github-api false

      - name: Validate Composer
        run: composer validate --strict --no-check-lock

      - name: Configure Dependency Matrix
        run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run Pest
        run: composer test

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run Rector Dry Run
        run: composer rector:test

      - name: Run Larastan
        run: composer analyse
